<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">电信客户流失分析流程 · 当前版本</title>
<desc id="desc">分层切分后，训练集执行SQL分群和嵌套重复验证；仅训练折外预测选择阈值和名额，冻结后评估测试集，最终由Streamlit展示。</desc>
<defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b3a}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#596560}.heading{font-size:21px;font-weight:700}.body{font-size:16px;fill:#596560}.tag{font-size:14px;fill:#176b63;font-weight:700}.card{fill:#fffdf9;stroke:#ded6cb;stroke-width:1.5}.arrow{fill:none;stroke:#899b94;stroke-width:2;marker-end:url(#arrow)}.number{font-size:18px;fill:#176b63;font-weight:700}</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#899b94" stroke-width="1.2"/></marker>
</defs>
<rect width="1440" height="960" rx="20" fill="#f5f1eb"/>
<rect x="56" y="48" width="5" height="53" rx="2.5" fill="#176b63"/>
<text x="78" y="76" class="title">从客户数据到固定容量排序</text>
<text x="78" y="107" class="subtitle">数据检查 → 训练内验证与选择 → 固定测试评估 → 看板展示</text>
<text x="1185" y="74" class="tag">流程版本 V3</text>
<rect x="485" y="145" width="470" height="89" rx="14" class="card"/>
<text x="510" y="181" class="heading">01  公开 CSV · 数据质量检查</text>
<text x="510" y="211" class="body">客户编号唯一性 / 标签 / 数值清洗</text>
<path d="M720 234 V263" class="arrow"/>
<rect x="485" y="267" width="470" height="89" rx="14" fill="#e7f0ec" stroke="#76a99e"/>
<text x="510" y="303" class="heading">02  按标签分层切分</text>
<text x="510" y="333" class="body">训练集 80% / 固定测试集 20%</text>
<path d="M485 312 H275 V389" class="arrow"/>
<path d="M720 356 V389" class="arrow"/>
<path d="M955 312 H1180 V613" class="arrow"/>
<rect x="58" y="394" width="405" height="169" rx="14" class="card"/>
<text x="82" y="429" class="tag">仅训练集</text>
<text x="82" y="464" class="heading">SQL 分群与统计推断</text>
<text x="82" y="496" class="body">SQLite / MySQL · 窗口排名与交叉分群</text>
<text x="82" y="526" class="body">Wilson 区间 · 卡方 / Holm · 关联强度</text>
<rect x="485" y="394" width="470" height="169" rx="14" class="card"/>
<text x="510" y="429" class="tag">仅训练集 · 外层验证隔离</text>
<text x="510" y="464" class="heading">03  嵌套重复分层验证</text>
<text x="510" y="496" class="body">外层 5 折 × 3 重复 / 内层 3 折调参</text>
<text x="510" y="526" class="body">Pipeline · LR / RF / LightGBM · 校准 / 消融</text>
<path d="M720 563 V605" class="arrow"/>
<rect x="485" y="610" width="470" height="135" rx="14" class="card"/>
<text x="510" y="648" class="heading">04  模型与决策规则冻结</text>
<text x="510" y="680" class="body">按外层平均 AP 选模型 · 相关折修正 + Holm</text>
<text x="510" y="711" class="body">训练 OOF 选择 F1 阈值与假设情景名额</text>
<path d="M955 677 H986" class="arrow"/>
<rect x="991" y="618" width="393" height="127" rx="14" class="card"/>
<text x="1015" y="655" class="heading">05  固定测试集评估</text>
<text x="1015" y="688" class="body">AP / AUC / Brier / 固定阈值 F1</text>
<text x="1015" y="718" class="body">预设 10% 排序 / 冻结名额情景</text>
<path d="M260 563 V791 H638 V816" class="arrow"/>
<path d="M1185 745 V791 H805 V816" class="arrow"/>
<rect x="485" y="820" width="470" height="88" rx="14" fill="#176b63"/>
<text x="510" y="856" style="fill:#fffdf9;font-size:21px;font-weight:700">06  Streamlit 看板 / 可选 AI 解读</text>
<text x="510" y="886" style="fill:#e7f0ec;font-size:16px">读取同次报告 · AI 不参与训练与排序</text>
<text x="58" y="935" class="subtitle">边界：测试标签不参与流程内选择；静态快照只评估历史标签，不估计因果挽留收益。</text>
</svg>
